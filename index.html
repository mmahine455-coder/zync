<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zync</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#030a1c;--g:rgba(140,190,255,.07);--ln:rgba(150,200,255,.2);--tx:#f2f7ff;--mu:#8fa6cc;--a:#38bdf8;--b:#2563eb;--c:#22d3ee;--ok:#22d3ee}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceeff;--g:rgba(255,255,255,.75);--ln:rgba(60,60,140,.16);--tx:#14163a;--mu:#5b6190}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;overflow:hidden}
.bgfx{position:fixed;inset:0;filter:blur(90px);opacity:.09}
.bgfx i{position:absolute;border-radius:50%;animation:f 14s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:60vmax;height:60vmax;background:var(--a);top:-20%;left:-20%}
.bgfx i:nth-child(2){width:50vmax;height:50vmax;background:var(--b);bottom:-20%;right:-15%;animation-delay:-6s;opacity:.7}
.bgfx i:nth-child(3){width:35vmax;height:35vmax;background:var(--c);top:35%;left:30%;animation-delay:-9s;opacity:.4}
@keyframes f{to{transform:translate(6vw,5vh) scale(1.2)}}
#root{position:relative;height:100%;max-width:520px;margin:auto;overflow:hidden}
.view{height:100%;overflow:auto;padding:14px 16px 120px}
.gl{background:var(--g);border:1px solid var(--ln);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border-radius:22px}
svg{flex:none}
h1.brand{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--b),var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
small{color:var(--mu)}
.av{width:var(--s,46px);height:var(--s,46px);border-radius:50%;padding:2px;background:conic-gradient(from 180deg,var(--k),var(--b),var(--c),var(--k));position:relative;flex:none}
.av>span,.av>img{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--k);color:#fff;font-weight:700;font-size:calc(var(--s,46px)*.4);border:2px solid var(--bg);object-fit:cover}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:30%;height:30%;border-radius:50%;background:var(--ok);border:2px solid var(--bg);box-shadow:0 0 8px var(--ok)}
.strip{display:flex;gap:14px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}
.strip div{text-align:center;font-size:12px;color:var(--mu);flex:none}
.add{width:50px;height:50px;border-radius:50%;border:1.5px dashed var(--mu);display:grid;place-items:center;color:var(--mu);margin:0 auto 2px}
.in{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--g);color:var(--tx);font:inherit;outline:0}
.in:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.it{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:18px;cursor:pointer}
.it:active{background:var(--g)}
.it .m{flex:1;min-width:0}.it b{display:block}.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:#fff;color:#000;border-radius:99px;font-size:11px;padding:2px 8px}
.bn{border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,var(--a),var(--b));color:#000;font:inherit;font-weight:600;cursor:pointer}
.bn.s{padding:6px 12px;font-size:13px;border-radius:11px}.bn.r{background:#000;color:#fff;border:1px solid #fff}.bn.o{background:var(--g);border:1px solid var(--ln);color:var(--tx)}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid var(--ln);background:var(--g);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:2px;padding:6px;border-radius:99px;background:rgba(30,30,30,.55);border:1px solid var(--ln);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .nav{background:rgba(255,255,255,.6)}}
.nav button{border:0;background:none;color:var(--mu);width:50px;height:44px;border-radius:99px;display:grid;place-items:center;cursor:pointer;transition:.25s;position:relative}
.nav button.on{color:#000;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 18px color-mix(in srgb,var(--a) 70%,transparent)}
.nav button .dot{position:absolute;top:7px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.page{position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;animation:sl .28s}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.hd h3{flex:1}.hd .t{flex:1;min-width:0}.hd .t b{display:block}
.bdy{flex:1;overflow:auto;padding:16px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 15px;border-radius:20px;line-height:1.45;animation:pp .25s}
@keyframes pp{from{opacity:0;transform:translateY(8px) scale(.96)}}
.bub.in{background:var(--g);border:1px solid var(--ln);border-bottom-left-radius:6px;align-self:flex-start}
.bub.out{align-self:flex-end;color:#000;background:linear-gradient(135deg,var(--a),var(--b));border-bottom-right-radius:6px}
.bub em{display:block;font-size:11px;font-style:normal;color:var(--b);margin-bottom:2px}
.bub time{display:block;font-size:10px;opacity:.65;margin-top:2px}
.ty{height:18px;padding:0 18px;font-size:12px;color:var(--mu)}
.bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{flex:1}.send{width:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));color:#000;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-height:112px;position:relative;overflow:hidden}
.tile .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--k)}
.tile small{display:block}
.card{padding:14px;margin-bottom:12px}
.hero{padding:18px;margin-bottom:14px;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));}
.sw{display:flex;gap:8px;margin:8px 0}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}.sw i.on{border-color:#fff}
.tg{width:48px;height:28px;border-radius:99px;background:var(--ln);position:relative;cursor:pointer;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--a)}.tg.on::after{left:23px;background:#000}
.bar2{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.stat{padding:14px}.stat b{font-size:26px;display:block}
.call{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 30%,#0b2a6b,#030a1c 70%);color:#fff}
.call .self{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:92px;height:124px;border-radius:18px;background:linear-gradient(160deg,#111,#333);border:1px solid var(--ln);display:none;place-items:center;font-size:12px;overflow:hidden}
.call.video .self{display:grid}
.call .av{animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}100%{box-shadow:0 0 0 55px rgba(56,189,248,0)}}
.ctl{display:flex;gap:14px;margin-top:28px}
.ctl button{width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.ctl .end{background:#fff;color:#000}.ctl .off{background:#fff;color:#111}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--g);cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.big{font-size:56px;font-weight:800;text-align:center;letter-spacing:2px;margin:20px 0}
.ban{opacity:.45}
#lg,#su{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
#lg .box,#su .box{width:min(380px,100%);padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:14px}
.zl{width:92px;height:92px;margin:auto;filter:drop-shadow(0 0 22px rgba(255,255,255,.22))}.zl svg{width:100%;height:100%}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;border:0;background:#fff;color:#222;font:inherit;font-weight:600;cursor:pointer}

/* ===== Liquid Glass ===== */
.bgfx{opacity:1;filter:blur(55px)}
.bgfx i{border-radius:42% 58% 63% 37%/45% 40% 60% 55%;animation:mo 14s ease-in-out infinite alternate,f 20s ease-in-out infinite alternate}
@keyframes mo{50%{border-radius:60% 40% 35% 65%/55% 62% 38% 45%}100%{border-radius:38% 62% 55% 45%/62% 38% 60% 40%}}
.bgfx i:nth-child(1){background:#fff;opacity:.34}
.bgfx i:nth-child(2){background:#bdbdbd;opacity:.3}
.bgfx i:nth-child(3){background:#8a8a8a;opacity:.4}
.gl,.card,.tile,.stat,.hero{background-color:rgba(0,0,0,.26);background-image:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.03) 55%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(26px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.08);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.12),0 12px 32px rgba(0,0,0,.35)}
.page{background:rgba(0,0,0,.5);backdrop-filter:blur(42px) saturate(170%);-webkit-backdrop-filter:blur(42px) saturate(170%)}
.hd{background:linear-gradient(180deg,rgba(255,255,255,.1),transparent);border-bottom:1px solid rgba(255,255,255,.14)}
#lg,#su{background:rgba(0,0,0,.4);backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px)}
.in,.bar .in,.search{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ib{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bn{background:linear-gradient(170deg,#fff,#d4d4d4);box-shadow:inset 0 1.5px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.15),0 8px 22px rgba(255,255,255,.18)}
.bn.o,.bn.r{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bub.in{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bub.out{background:linear-gradient(165deg,#fff,#cdcdcd);box-shadow:inset 0 1.5px 0 #fff,0 8px 22px rgba(255,255,255,.2)}
.send{background:linear-gradient(170deg,#fff,#d0d0d0);box-shadow:inset 0 1.5px 0 #fff,0 6px 18px rgba(255,255,255,.2)}
.it{transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.it:active{background:rgba(255,255,255,.1);transform:scale(.97)}
.bn:active,.ib:active,.tile:active,.send:active{transform:scale(.93)}
.bn,.ib,.tile,.send{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.nav{background-color:rgba(0,0,0,.2);background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(30px) saturate(200%) brightness(1.1);-webkit-backdrop-filter:blur(30px) saturate(200%) brightness(1.1);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 6px rgba(255,255,255,.08),0 14px 40px rgba(0,0,0,.5)}
.nav::before{content:"";position:absolute;left:6px;top:6px;width:50px;height:44px;border-radius:99px;transform:translateX(calc(var(--i,0)*52px));transition:transform .55s cubic-bezier(.34,1.7,.5,1);background:linear-gradient(170deg,#fff,#cfcfcf);box-shadow:inset 0 2px 0 #fff,0 0 22px rgba(255,255,255,.45)}
.nav button.on{background:none;box-shadow:none;color:#000}
.nav button{z-index:1;transition:color .3s}
.tg.on{box-shadow:0 0 14px rgba(255,255,255,.5)}

/* ===== Midnight Blue + Cyan ===== */
.bgfx i:nth-child(1){background:#2563eb;opacity:.6}
.bgfx i:nth-child(2){background:#22d3ee;opacity:.4}
.bgfx i:nth-child(3){background:#6366f1;opacity:.45}
.gl,.card,.tile,.stat,.hero{background-color:rgba(4,14,40,.38);border:1px solid rgba(150,210,255,.24);box-shadow:inset 0 1.5px 0 rgba(200,235,255,.5),inset 0 -1px 0 rgba(150,210,255,.1),0 12px 32px rgba(0,10,40,.5)}
.page{background:rgba(3,10,28,.55)}
.bn,.send{background:linear-gradient(170deg,#4cc9ff,#2563eb);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -3px 6px rgba(0,0,60,.25),0 8px 22px rgba(56,189,248,.35)}
.bub.out{background:linear-gradient(165deg,#4cc9ff,#2563eb);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),0 8px 22px rgba(56,189,248,.3)}
.nav::before{background:linear-gradient(170deg,#4cc9ff,#2563eb);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 0 24px rgba(56,189,248,.65)}
.nav button.on{color:#fff}
.bd{background:linear-gradient(135deg,#22d3ee,#2563eb);color:#fff}
.tg.on{background:#38bdf8;box-shadow:0 0 14px rgba(56,189,248,.6)}
.tg.on::after{background:#fff}
.in:focus,.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.2)}
.ctl .end{background:#ff4d6d;color:#fff;box-shadow:0 0 24px rgba(255,77,109,.6)}
.zl{filter:drop-shadow(0 0 24px rgba(56,189,248,.45))}
.bn.o,.bn.r{background:rgba(120,190,255,.12);color:#fff;border:1px solid rgba(150,210,255,.35)}
</style>
</head>

onAuthStateChanged(auth,async u=>{
 stop();U=u;PF=null;
 if(!u){CH=[];REQ=[];window.IS_ADMIN=false;$("#lg").style.display="flex";return}
 const ref=doc(db,"users",u.uid);
 try{const sn=await getDoc(ref);
  if(sn.exists()&&sn.data().banned){await signOut(auth);$("#le").textContent="এই অ্যাকাউন্ট ব্যান করা হয়েছে";return}
  if(!sn.exists())await setDoc(ref,{name:u.displayName||"ব্যবহারকারী",email:u.email,photoURL:u.photoURL||"",banned:false,verified:false,joined:serverTimestamp(),lastSeen:Date.now()});
  else await updateDoc(ref,{lastSeen:Date.now()});
 }catch(e){$("#le").textContent="Firestore Rules সেট করুন ("+e.code+")";return}
 window.IS_ADMIN=u.email===ADMIN&&u.emailVerified;
 try{const ps=await getDoc(doc(db,"profiles",u.uid));PF=ps.exists()?ps.data():await setup()}catch(e){$("#le").textContent="প্রোফাইল পড়া যায়নি ("+e.code+")";return}
 S.me.name=PF.name;S.me.photo=PF.photoURL||"";S.me.role=IS_ADMIN?"অ্যাডমিন":"সদস্য";
 if(!S.me.bio||S.me.bio=="নবম শ্রেণি · বিজ্ঞান")S.me.bio="@"+PF.username;
 $("#lg").style.display="none";
 subs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",u.uid)),s=>{
  CH=s.docs.map((d,i)=>{const x=d.data(),o=x.members.find(m=>m!=u.uid);return{id:d.id,n:x.names[o]||"?",k:i,sub:"@"+(x.users[o]||""),photo:x.photos?.[o]||"",last:x.last||"",lastT:x.lastT||0,other:o}}).sort((a,b)=>b.lastT-a.lastT);
  FR=CH.map(c=>({n:c.n}));render()},()=>{}));
 subs.push(onSnapshot(query(collection(db,"requests"),where("to","==",u.uid)),s=>{REQ=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status=="pending");render()},()=>{}));
 subs.push(onSnapshot(doc(db,"config","app"),d=>{if(d.exists()){Object.assign(S.cfg,d.data());render()}},()=>{}));
 hb=setInterval(()=>updateDoc(ref,{lastSeen:Date.now()}).catch(()=>{}),60000);
 render();
});
window.syncMe=()=>{if(!U||!PF)return;PF.name=S.me.name;PF.photoURL=S.me.photo||PF.photoURL||"";
 updateDoc(doc(db,"profiles",U.uid),{name:PF.name,photoURL:PF.photoURL}).catch(()=>{});updateDoc(doc(db,"users",U.uid),{name:PF.name}).catch(()=>{})};
window.vChats=()=>`<div class="top"><div class="row" style="gap:10px"><span style="width:34px;height:34px;display:block"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="98" height="98" rx="26" fill="#07142e" stroke="#fff" stroke-opacity=".22" stroke-width="2"/><path d="M31 33H71L31 67H71V81L60 67" transform="translate(4 4)" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 33H71L31 67H71V81L60 67" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="24" r="4.5" fill="#38bdf8"/></svg></span><h1 class="brand">${esc(S.cfg.app)}</h1></div><button class="ib" onclick="addFriend()">${ic('plus')}</button></div>
${S.cfg.banner?`<div class="gl card"><small>নোটিশ</small><div>${esc(S.cfg.banner)}</div></div>`:""}
${REQ.length?`<h3 style="margin:4px 0 8px">বন্ধুর অনুরোধ</h3>`+REQ.map(r=>`<div class="gl card row">${av(r.fromName,1,40,r.fromPhoto)}<div style="flex:1;min-width:0"><b>${esc(r.fromName)}</b><small>@${esc(r.fromUser)}</small></div><button class="bn s" onclick="acceptReq('${r.id}')">Accept</button><button class="ib" style="width:34px;height:34px" onclick="rejectReq('${r.id}')">${ic('x',16)}</button></div>`).join(""):""}
<input class="in" id="q" placeholder="খুঁজুন…" style="margin-bottom:8px">
${CH.length?CH.map(c=>`<div class="it" onclick="openChat('${c.id}')">${av(c.n,c.k,48,c.photo)}<div class="m"><b>${esc(c.n)}</b><small>${esc(c.last)}</small></div></div>`).join(""):`<div class="gl card" style="text-align:center;color:var(--mu)">এখনো কোনো বন্ধু নেই। উপরের + চেপে ইউজারনেম দিয়ে বন্ধু খুঁজুন।</div>`}`;
window.vCalls=()=>`<div class="top"><h1 class="brand">কল</h1></div><div class="gl card"><small>কল এখন ডেমো, আসল ভয়েস/ভিডিও কল পরের ধাপে আসছে।</small></div>`+CH.map((c,i)=>`<div class="it" onclick="callIdx(${i},0)">${av(c.n,c.k,48,c.photo)}<div class="m"><b>${esc(c.n)}</b><small>${esc(c.sub)}</small></div><button class="ib" onclick="event.stopPropagation();callIdx(${i},1)">${ic('video',20)}</button></div>`).join("");
window.callIdx=(i,v)=>{const c=CH[i];if(c)startCall(c.n,c.k,v)};
window.addGroup=()=>alert("গ্রুপ চ্যাট শীঘ্রই আসছে");
window.acceptReq=async id=>{const r=REQ.find(x=>x.id==id);if(!r)return;const a=r.from,b=r.to,m=[a,b].sort();
 try{await updateDoc(doc(db,"requests",id),{status:"accepted"});
  await setDoc(doc(db,"chats",m.join("_")),{members:m,names:{[a]:r.fromName,[b]:PF.name},users:{[a]:r.fromUser,[b]:PF.username},photos:{[a]:r.fromPhoto||"",[b]:PF.photoURL||""},last:"আমরা এখন বন্ধু!",lastT:Date.now()})}catch(e){alert("হয়নি: "+e.code)}};
window.rejectReq=id=>deleteDoc(doc(db,"requests",id)).catch(()=>{});
window.addFriend=()=>{
 const p=page(hd("বন্ধু খুঁজুন")+'<div class="bdy"><input class="in" id="fs" placeholder="ইউজারনেম লিখুন, যেমন rafi09" autocapitalize="off"><div id="fr" style="margin-top:12px"></div></div>');let t;
 p.querySelector("#fs").oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{
  const q=e.target.value.trim().toLowerCase().replace(/^@/,""),o=p.querySelector("#fr");if(q.length<2){o.innerHTML="";return}
  try{const s=await getDocs(query(collection(db,"profiles"),where("username",">=",q),where("username","<=",q+"\uf8ff"),limit(10)));
   const L=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.id!=U.uid);
   o.innerHTML=L.length?L.map((x,i)=>`<div class="gl card row">${av(x.name,i,42,x.photoURL)}<div style="flex:1;min-width:0"><b>${esc(x.name)}</b><small>@${esc(x.username)}</small></div>${CH.some(c=>c.other==x.id)?"<small>বন্ধু</small>":`<button class="bn s" data-id="${x.id}">যোগ করুন</button>`}</div>`).join(""):"<small>কাউকে পাওয়া যায়নি</small>";
   o.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{const x=L.find(y=>y.id==b.dataset.id);
    try{await setDoc(doc(db,"requests",U.uid+"_"+x.id),{from:U.uid,to:x.id,fromName:PF.name,fromUser:PF.username,fromPhoto:PF.photoURL||"",status:"pending",t:Date.now()});b.outerHTML="<small>অনুরোধ পাঠানো হয়েছে</small>"}catch(e){alert("হয়নি: "+e.code)}})
  }catch(e){o.textContent="সার্চ হয়নি: "+e.code}},350)}};
window.openChat=id=>{
 const c=CH.find(x=>x.id==id);if(!c)return;
 const p=page(`<div class="hd"><button class="ib b">${ic('back')}</button>${av(c.n,c.k,40,c.photo)}<div class="t"><b>${esc(c.n)}</b><small>${esc(c.sub)}</small></div><button class="ib a">${ic('phone',20)}</button><button class="ib v">${ic('video',20)}</button></div><div class="msgs"></div><div class="bar"><input class="in" placeholder="মেসেজ লিখুন…"><button class="send">${ic('send',20)}</button></div>`);
 const M=p.querySelector(".msgs"),inp=p.querySelector("input");
 const un=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("t"),limitToLast(100)),s=>{
  if(!p.isConnected){un();return}M.innerHTML="";
  s.docs.forEach(d=>{const m=d.data(),b=document.createElement("div");b.className="bub "+(m.from==U.uid?"out":"in");b.innerHTML=esc(m.text)+`<time>${new Date(m.t).toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit"})}</time>`;M.append(b)});M.scrollTop=M.scrollHeight},()=>{});
 const go=async()=>{const v=inp.value.trim();if(!v)return;inp.value="";
  try{await addDoc(collection(db,"chats",id,"messages"),{from:U.uid,text:v,t:Date.now()});await updateDoc(doc(db,"chats",id),{last:v.slice(0,60),lastT:Date.now()})}catch(e){alert("পাঠানো যায়নি: "+e.code)}};
 p.querySelector(".send").onclick=go;inp.onkeydown=e=>{if(e.key=="Enter")go()};
 p.querySelector(".b").onclick=()=>{p.remove();render()};
 p.querySelector(".a").onclick=()=>startCall(c.n,c.k,0);p.querySelector(".v").onclick=()=>startCall(c.n,c.k,1);
};
window.admin=function(){
 if(!window.IS_ADMIN)return;
 const pg=page(hd("অ্যাডমিন প্যানেল")+'<div class="bdy"></div>'),b=pg.querySelector(".bdy");
 b.innerHTML=`<div class="grid" id="st" style="margin-bottom:14px"></div><h3 style="margin:6px 0 8px">অ্যাপ সেটিংস (সবার জন্য)</h3><div class="gl card"><small>অ্যাপের নাম</small><input class="in" id="an" value="${esc(S.cfg.app)}"><small style="display:block;margin-top:8px">নোটিশ</small><input class="in" id="ab" value="${esc(S.cfg.banner||"")}" placeholder="খালি রাখলে দেখাবে না"><div class="row" style="margin:12px 0"><b style="flex:1">AI সহায়ক চালু</b>${tg(S.cfg.ai,"ta")}</div><button class="bn" id="as">সেভ করুন</button></div><h3 style="margin:14px 0 8px">সদস্য তালিকা</h3><div id="ml"></div>`;
 $("#ta").onclick=e=>e.currentTarget.classList.toggle("on");
 $("#as").onclick=async()=>{try{await setDoc(doc(db,"config","app"),{app:$("#an").value||"Zync",banner:$("#ab").value,ai:$("#ta").classList.contains("on")},{merge:true});alert("সেভ হয়েছে")}catch(e){alert("সেভ হয়নি: "+e.code)}};
 const un=onSnapshot(collection(db,"users"),s=>{
  if(!pg.isConnected){un();return}
  const L=s.docs.map(d=>({id:d.id,...d.data()})),now=Date.now(),on=x=>now-(x.lastSeen||0)<120000;
  $("#st").innerHTML=`<div class="gl stat"><small>মোট সদস্য</small><b>${bn(L.length)}</b></div><div class="gl stat"><small>এখন অনলাইন</small><b>${bn(L.filter(x=>on(x)&&!x.banned).length)}</b></div><div class="gl stat"><small>ভেরিফাইড</small><b>${bn(L.filter(x=>x.verified).length)}</b></div><div class="gl stat"><small>ব্যান</small><b>${bn(L.filter(x=>x.banned).length)}</b></div>`;
  $("#ml").innerHTML=L.map((x,i)=>`<div class="gl card row ${x.banned?"ban":""}">${av(x.name||"?",i,40,x.photoURL,on(x))}<div style="flex:1;min-width:0"><b>${esc(x.name||"")} ${x.verified?"✔":""}</b><small>${esc(x.email||"")}</small></div>${x.email==ADMIN?"<small>আপনি</small>":`<button class="bn s o" data-v="${x.id}">${x.verified?"আনভেরিফাই":"ভেরিফাই"}</button><button class="ib" data-b="${x.id}" style="width:34px;height:34px">${ic("ban",16)}</button><button class="ib" data-d="${x.id}" style="width:34px;height:34px">${ic("trash",16)}</button>`}</div>`).join("");
  const g=id=>L.find(x=>x.id==id);
  b.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>updateDoc(doc(db,"users",e.dataset.v),{verified:!g(e.dataset.v).verified}));
  b.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>updateDoc(doc(db,"users",e.dataset.b),{banned:!g(e.dataset.b).banned}));
  b.querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{if(confirm("সদস্যের ডেটা মুছবেন?"))deleteDoc(doc(db,"users",e.dataset.d))});
 },e=>{$("#ml").textContent="অনুমতি নেই: "+e.code});
};
</script>
